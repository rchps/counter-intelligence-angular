# Turns on auto-merge for Dependabot's minor and patch updates, so they merge themselves once the required
# checks pass (branch protection on main). Major updates are left for a person. From GitHub's example:
# docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'rchps/counter-intelligence-angular'
    steps:
      - name: Read what the PR updates
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # update-type is the biggest version jump in the PR, so a group with one major update in it waits too.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        name: Merge once the checks pass
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
