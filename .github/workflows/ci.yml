# Runs on every push. The checks and e2e jobs are what a pull request needs to pass before it can merge
# into main (branch protection), and a push to main that passes them is deployed to Cloudflare, where
# Cloudflare Access decides who can see it. Any other branch gets a preview of its own, behind the same
# login. Screenshot comparisons have a workflow of their own (screenshots.yml).
#
# Each deploy of main is a release (scripts/release.mts, docs/ci-cd.md#releases): the deploy job works
# out the next version from the changesets, builds with it, deploys, and only then tags the commit. All of
# that is the script's; the only host-specific parts are calling it and pushing the tag.
#
# Cloudflare serves the site as a Worker with static assets (wrangler.jsonc). Its one script,
# worker/index.ts, files feedback as GitHub issues; its secrets are set in Cloudflare, never here
# (docs/ci-cd.md). The build carries the maps name, so it's never uploaded as a GitHub artifact: on a
# public repo, anyone can download those.
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces, except on main, where every push deploys.
# Even there, a run still waiting its turn is replaced by a newer one (GitHub keeps one pending run per
# group), so "What changed" can't assume the run before this one was ever built: see below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: 'false'
  WORKER_NAME: counter-intelligence
  WORKERS_SUBDOMAIN: counter-intelligence-angular.workers.dev

jobs:
  # Which jobs this push needs, from the files it changes. On main, that's the files changed since the
  # last revision that reached production, not since the previous push: a run waiting behind another can
  # be replaced by a newer push, so a docs-only push compared with the previous one could hide the
  # application change that run carried (#47). If that revision can't be found, everything runs. On any
  # other branch, everything it changes compared with main, so a docs-only push to a branch that also
  # changes code still runs every test. A job skipped this way reports success, which is
  # what lets a required check pass on a docs-only PR (skipping the whole workflow would leave it pending).
  # Each filter is "everything except...", so a new kind of file runs every test until it's listed here.
  changes:
    name: What changed
    # Run by hand, everything runs: the outputs stay empty, and the jobs below treat that as "changed".
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # deployments: read lists the production deployments; unlisted permissions would drop to none.
    permissions:
      contents: read
      deployments: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On main the last deployed revision can be many pushes back, so fetch the history to diff from it.
          # case(), not `&& 0 || 1`: 0 is falsy in expressions, so that form would always give 1.
          fetch-depth: ${{ case(github.ref == 'refs/heads/main', 0, 1) }}
      # The newest production deployment whose latest status is "success" is what's live. A failed or
      # cancelled deploy never reaches that status, so the next push on main still compares with the last
      # good deploy and picks the change up again. Empty when it can't be found (no deployment yet, an API
      # error, or a revision no longer in the history), and the filter below is skipped: everything runs.
      - name: Find the revision in production
        id: deployed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(
            gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30" \
              --jq 'sort_by(.created_at) | reverse | .[].id' |
            while read -r id; do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq 'sort_by(.created_at) | last | .state // empty')
              if [ "$state" = success ]; then
                gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha
                break
              fi
            done
          ) || sha=
          if [ -n "$sha" ] && git cat-file -e "$sha^{commit}"; then
            echo "Production is at $sha"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No deployed revision found, so every job will run."
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        # On main, only with a deployed revision to compare against. Skipped, the outputs stay empty.
        if: github.ref != 'refs/heads/main' || steps.deployed.outputs.sha != ''
        with:
          base: ${{ steps.deployed.outputs.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            # Nothing a check, test, or build reads.
            not-code: &not-code
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.claude/**'
              - '!.vscode/**'
              - '!.mcp.json'
              - '!.github/dependabot.yml'
              - '!.github/workflows/dependabot-auto-merge.yml'
              - '!.github/workflows/screenshots*.yml'
            # Anything else: lint, tests, the build, and a deploy.
            code:
              - '**'
              - *not-code
            # What the end-to-end tests run: the app, its data, and the Cypress specs. Not the Worker
            # (the tests stand in for /api/feedback), the data scripts, unit tests, or lint and format
            # settings, which the checks job covers.
            app:
              - '**'
              - *not-code
              - '!worker/**'
              - '!wrangler.jsonc'
              - '!scripts/**'
              - '!src/**/*.spec.ts'
              - '!tsconfig.{spec,scripts,worker,worker-spec}.json'
              - '!api/**' # the spec and its generated types: types only, gone at runtime
              - '!openapi-ts.config.ts'
              - '!redocly.yaml'
              - '!eslint.config.js'
              - '!.prettierrc'
              - '!.husky/**'
              - '!lint-staged.config.mjs'
              - '!cypress/{visual,readme}/**'
              - '!cypress.{visual,readme}.config.ts'

  checks:
    name: Lint, unit tests, data, build
    needs: [changes]
    # !cancelled() lets this run when "What changed" was skipped (run by hand) or failed: when in doubt, test.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: '0' # this job doesn't open a browser, so skip the Cypress download
    steps:
      - uses: actions/checkout@v7
        with:
          # The history and tags: the changeset check compares with main, and the build's version comes
          # from `git describe`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A warning, not a failure: not every change is one the counter would notice.
      - name: Changeset
        if: github.ref != 'refs/heads/main'
        run: npm run release -- check origin/main
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run test:scripts
      - run: npm run test:worker
      - run: npm run typecheck:worker
      - run: npm run api:check
      - run: npm run validate-data
      - run: npm run build

  e2e:
    name: End-to-end tests
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm's cache holds the Cypress package, not the browser-driving app it downloads on install.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

  # Every branch but main gets its own preview URL, behind the same Access login as the real site. Not
  # Dependabot's branches: its runs don't get the repo's secrets, and there's nothing to look at anyway.
  # Nor a docs-only push, where the checks were skipped: the site hasn't changed.
  preview:
    name: Preview deploy
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.alias.outputs.url }}
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so the version reads like v1.4.0-3-gc68fb5d: a preview, not a release
      # Cloudflare's rules for the alias: lowercase letters, numbers, and dashes, starting with a letter,
      # and at most 63 characters together with "-<worker name>" (it's one part of a hostname).
      - name: Name the preview after the branch
        id: alias
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          max=$((63 - 1 - ${#WORKER_NAME}))
          alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^[^a-z]+//' | cut -c1-"$max" | sed -E 's/-+$//')
          [ -n "$alias" ] || alias=branch
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "url=https://$alias-$WORKER_NAME.$WORKERS_SUBDOMAIN" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          MAPS_NAME: ${{ secrets.MAPS_NAME }}
        run: npm run build
      # Uploads a version without deploying it: main's site doesn't change.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}
      - name: Link the preview
        env:
          URL: ${{ steps.alias.outputs.url }}
        run: |
          echo "Preview (Access login required): $URL" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloudflare
    needs: [checks, e2e]
    # A job whose needs were skipped is skipped too, unless its condition says otherwise. A Worker-only
    # change skips the end-to-end tests but still deploys; a docs-only change skips the checks and doesn't.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.checks.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: write pushes the release tag (not commits: main is protected, and needs none).
    permissions:
      contents: write
    # Records each deploy as a GitHub deployment, listed with the previews and linking to the live site.
    environment:
      name: production
      url: https://${{ env.WORKER_NAME }}.${{ env.WORKERS_SUBDOMAIN }}
    # One deploy at a time, and a queued one waits instead of cancelling the one in flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag and the history between: the next version counts the changesets added since the
          # last release tag. Checked out after this job's turn in the deploy queue, so a release tagged
          # by the deploy before it is already here.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Plan the release
        id: release
        run: npm run --silent release -- plan >> "$GITHUB_OUTPUT"
      # Without the site key the build still succeeds, just with the feedback button hidden, so stop here
      # instead of shipping that by accident.
      - name: Build
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          MAPS_NAME: ${{ secrets.MAPS_NAME }}
          # The version this deploy releases, not yet tagged (that waits for the deploy to succeed).
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error::The TURNSTILE_SITE_KEY variable isn't set (repo Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          npm run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'
          command: deploy
      # Only after a deploy that worked, so every tag is a release that went live. A re-run of a deploy
      # that was already tagged finds the tag on this commit and makes no new one.
      - name: Tag the release
        if: steps.release.outputs.tagged != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release -- tag
          git push origin "${{ steps.release.outputs.version }}"
          echo "Released ${{ steps.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
