<div class="wrap">
  <div class="brandmark">
    <span class="sq" aria-hidden="true">SDS</span>
    <span class="t">
      Counter Intelligence
      <small>Security Data Supply</small>
    </span>
  </div>

  <nav class="nav" aria-label="Sections">
    <a routerLink="/lines" routerLinkActive="active" ariaCurrentWhenActive="page">Line Card</a>
    <a routerLink="/branches" routerLinkActive="active" ariaCurrentWhenActive="page">Branches</a>
    <a routerLink="/tools" routerLinkActive="active" ariaCurrentWhenActive="page">Tools</a>
  </nav>

  <span class="pill-internal" role="note" title="Internal use only. Do not send to customers.">
    Internal only
  </span>

  <!-- Always-visible way to report a problem (the fuller card sits at the end of each page). -->
  @if (feedback.available()) {
    <button
      type="button"
      class="topbar-report"
      title="Report a problem or suggest an idea"
      aria-label="Feedback"
      (click)="feedback.open({}, $event.currentTarget)"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
      </svg>
      <span>Feedback</span>
    </button>
  }

  <!-- Theme switch: WAI-ARIA "switch" pattern (role=switch + aria-checked) -->
  <button
    type="button"
    class="theme-switch"
    role="switch"
    [attr.aria-checked]="theme.isDark()"
    aria-label="Dark mode"
    (click)="theme.toggle()"
  >
    <span class="ts-label">Dark</span>
    <span class="ts-track" aria-hidden="true">
      <span class="ts-knob">
        <svg
          class="ts-sun"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg class="ts-moon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
      </span>
    </span>
  </button>
</div>
