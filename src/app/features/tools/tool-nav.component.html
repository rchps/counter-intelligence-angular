<nav class="tk-nav" aria-label="Tools">
  <button
    #toggle
    type="button"
    class="tk-toggle"
    data-cy="tool-menu-toggle"
    aria-controls="tool-menu"
    [attr.aria-expanded]="open()"
    (click)="open.set(!open())"
  >
    <span class="tk-toggle-k">Tools</span>
    <span class="tk-toggle-current">
      <span class="tk-dot" [attr.data-dot]="current()"></span>
      {{ currentLabel() }}
    </span>
    <svg
      class="tk-chevron"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>
  <div id="tool-menu" class="tk-list" data-cy="tool-menu" [class.open]="open()">
    @for (group of groups; track group.group) {
      <p class="tk-group">{{ group.group }}</p>
      @for (item of group.items; track item.id) {
        <a
          [routerLink]="['/tools', item.id]"
          [attr.data-cy]="'tool-link-' + item.id"
          routerLinkActive="current"
          ariaCurrentWhenActive="page"
          (click)="close()"
        >
          <span class="tk-dot" [attr.data-dot]="item.id"></span>
          {{ item.label }}
        </a>
      }
    }
  </div>
</nav>
